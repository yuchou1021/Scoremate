name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt

      - name: Core logic tests（调性/音域/难度/转调/简化）
        run: python server/tests/smoke_core.py

      - name: API + WebSocket tests
        run: python server/tests/smoke_ws.py

      - name: End-to-end pipeline（6 份测试谱）
        run: python test-scores/verify_pipeline.py
